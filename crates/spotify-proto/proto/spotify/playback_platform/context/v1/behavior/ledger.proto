syntax = "proto3";

package spotify.playback_platform.context.v1.behavior;

option java_package = "spotify.playback_platform.context.v1.behavior";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message Ledger {
  optional string entry_id = 2;
  optional bool include_playing_info = 3;
  reserved 1;
  reserved "enabled";
}
