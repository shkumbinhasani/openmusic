syntax = "proto3";

package spotify.lyrics_reporting_esperanto.proto;

option java_package = "com.spotify.lyrics_reporting_esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

