<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CD983"/>
      <stop offset="1" stop-color="#159F50"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smooth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="24" intercept="-11.5"/>
      </feComponentTransfer>
    </filter>
    <filter id="tileSmooth" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="34"/><feComponentTransfer><feFuncA type="linear" slope="40" intercept="-19.5"/></feComponentTransfer></filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <g id="tileShape"><rect x="100" y="100" width="824" height="824" rx="170" filter="url(#tileSmooth)"/></g>
    <g id="raw">
      <polygon points="428,300 710,244 710,322 428,378"/>
      <rect x="428" y="330" width="48" height="370"/>
      <rect x="662" y="270" width="48" height="370"/>
      <ellipse cx="394" cy="700" rx="84" ry="66" transform="rotate(-18 394 700)"/>
      <ellipse cx="628" cy="640" rx="84" ry="66" transform="rotate(-18 628 640)"/>
    </g>
    <g id="glyph"><g filter="url(#smooth)"><use href="#raw" fill="#FFFFFF"/></g></g>
  </defs>

  <use href="#tileShape" fill="#000000" opacity="0.25" transform="translate(0 14)" filter="url(#tileShadow)"/>
  <use href="#tileShape" fill="url(#tile)"/>
  

  <g transform="translate(0 10)">
    <g opacity="0.28" transform="translate(0 14)" filter="url(#glyphShadow)"><use href="#raw" fill="#063D1E"/></g>
    <g opacity="0.95"><use href="#glyph"/></g>
  </g>
</svg>
