syntax = "proto3";

package spotify.curation_state.proto;

option optimize_for = CODE_SIZE;

message CuratedPlaylistItem {
  string item_uri = 1;
  bytes item_id = 2;
  repeated string artist_uri = 3;
}

message CuratedPlaylist {
  repeated .spotify.curation_state.proto.CuratedPlaylistItem item = 1;
  bytes revision = 2;
}
