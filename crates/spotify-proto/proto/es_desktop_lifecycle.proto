syntax = "proto3";

package spotify.desktop.lifecycle_esperanto.proto;

import "google/protobuf/empty.proto";

option optimize_for = CODE_SIZE;

message NotifyViewLoadedRequest {
  string uri = 1;
  int32 inner_width = 2;
  int32 inner_height = 3;
}

service DesktopLifecycle {
  rpc Restart(.google.protobuf.Empty) returns (.google.protobuf.Empty);
  rpc Shutdown(.google.protobuf.Empty) returns (.google.protobuf.Empty);
  rpc NotifyViewLoaded(.spotify.desktop.lifecycle_esperanto.proto.NotifyViewLoadedRequest) returns (.google.protobuf.Empty);
}
