syntax = "proto3";

package spotify.player.esperanto.proto;

import "es_command_options.proto";
import "es_logging_params.proto";
import "es_play_options.proto";
import "es_prepare_play.proto";

option java_package = "com.spotify.player.esperanto.proto";
option optimize_for = CODE_SIZE;
option objc_class_prefix = "ESP";

message PlayRequest {
  enum StreamPolicy {
    AUTO = 0;
    CONTINUE = 1;
    NEW_STREAM = 2;
    REPLACE_STREAM = 3;
  }
  .spotify.player.esperanto.proto.PreparePlayRequest prepare_play_request = 1;
  .spotify.player.esperanto.proto.PlayOptions play_options = 2;
  .spotify.player.esperanto.proto.CommandOptions options = 3;
  .spotify.player.esperanto.proto.LoggingParams logging_params = 4;
  .spotify.player.esperanto.proto.PlayRequest.StreamPolicy stream_policy = 5;
  optional string replaced_logical_playback_identifier = 7;
}

message PlayPreparedRequest {
  string session_id = 1;
  .spotify.player.esperanto.proto.PlayOptions play_options = 2;
  .spotify.player.esperanto.proto.CommandOptions options = 3;
  .spotify.player.esperanto.proto.LoggingParams logging_params = 4;
}
