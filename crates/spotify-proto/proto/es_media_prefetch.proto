syntax = "proto3";

package spotify.prefetch_esperanto.proto;

import "google/protobuf/empty.proto";

option java_package = "com.spotify.prefetch_esperanto.proto";
option optimize_for = CODE_SIZE;
option objc_class_prefix = "ESP";

message AudioPreviewResource {
  string url = 1;
}

message ProgressiveVideoResource {
  string url = 1;
}

message SegmentedVideoResource {
  bytes video_id = 1;
  optional int32 start_ms = 2;
  optional int32 end_ms = 3;
  optional string entity_uri = 4;
}

message Item {
  oneof resource {
    .spotify.prefetch_esperanto.proto.AudioPreviewResource audio_preview_resource = 1;
    .spotify.prefetch_esperanto.proto.ProgressiveVideoResource progressive_video_resource = 2;
    .spotify.prefetch_esperanto.proto.SegmentedVideoResource segmented_video_resource = 3;
  }
}

message Future {
  repeated .spotify.prefetch_esperanto.proto.Item items = 1;
}

message UpdateFutureRequest {
  string feature_id = 1;
  .spotify.prefetch_esperanto.proto.Future future = 2;
}

message SegmentProfileSelectionConfig {
  repeated .spotify.prefetch_esperanto.proto.EncryptionScheme supported_encryption_schemes = 1;
  repeated .spotify.prefetch_esperanto.proto.VideoCodecFamily supported_video_codecs = 2;
  bool video_codecs_are_priority_ordered = 3;
}

enum EncryptionScheme {
  ENCRYPTION_SCHEME_UNKNOWN = 0;
  ENCRYPTION_SCHEME_CBCS = 1;
  ENCRYPTION_SCHEME_CTR = 2;
}

enum VideoCodecFamily {
  VIDEO_CODEC_FAMILY_UNKNOWN = 0;
  VIDEO_CODEC_FAMILY_H264 = 1;
  VIDEO_CODEC_FAMILY_HEVC = 2;
  VIDEO_CODEC_FAMILY_AV1 = 3;
}

service MediaPrefetch {
  rpc UpdateFuture(.spotify.prefetch_esperanto.proto.UpdateFutureRequest) returns (.google.protobuf.Empty);
  rpc UpdateSegmentProfileSelectionConfig(.spotify.prefetch_esperanto.proto.SegmentProfileSelectionConfig) returns (.google.protobuf.Empty);
}
