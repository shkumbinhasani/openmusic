syntax = "proto3";

package spotify.read_reporting_esperanto.proto;

import "endpoint/reason_end.proto";

option java_package = "com.spotify.read_reporting_esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message ReadEndRequest {
  bytes session_id = 1;
  int64 wall_timestamp_ms = 2;
  int64 monotonic_timestamp_ms = 3;
  .spotify.read_reporting_esperanto.proto.ReasonEnd reason_end = 4;
}
