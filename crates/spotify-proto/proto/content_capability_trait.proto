syntax = "proto3";

package spotify.contentagnostic.v2;

option java_package = "com.spotify.contentagnostic.v2";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message Capability {
  oneof value {
    .spotify.contentagnostic.v2.Allowed allowed = 1;
    .spotify.contentagnostic.v2.Disallowed disallowed = 2;
    .spotify.contentagnostic.v2.Restricted restricted = 3;
    .spotify.contentagnostic.v2.Irrelevant irrelevant = 4;
  }
}

message Allowed {
}

message Disallowed {
}

message Restricted {
  oneof condition {
    .spotify.contentagnostic.v2.ProductStateCondition product_state = 1;
  }
}

message Irrelevant {
}

message ContentCapabilityTrait {
  .spotify.contentagnostic.v2.Capability rateability = 1;
  .spotify.contentagnostic.v2.Capability downloadability = 2;
  .spotify.contentagnostic.v2.Capability recordability = 3;
  .spotify.contentagnostic.v2.Capability watchability = 4;
  .spotify.contentagnostic.v2.Capability layerability = 6;
  reserved 5;
}

message ProductStateCondition {
  string key = 1;
  string expected_value = 2;
}
