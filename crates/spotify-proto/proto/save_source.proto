syntax = "proto3";

package spotify.list_collection.save_source.proto;

option java_package = "com.spotify.list_collection.save_source.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message SaveSource {
  optional string original_uri = 1;
  optional string interaction_id = 2;
  optional .spotify.list_collection.save_source.proto.SourceTool source_tool = 3;
}

enum SourceTool {
  SOURCE_TOOL_UNSPECIFIED = 0;
  SOURCE_TOOL_PROMPT = 1;
  SOURCE_TOOL_STUDIO_AGENT = 2;
}
