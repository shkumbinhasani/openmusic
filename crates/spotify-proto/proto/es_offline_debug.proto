syntax = "proto3";

package spotify.offline_esperanto.proto;

import "google/protobuf/empty.proto";
import "extension_kind.proto";

option java_package = "com.spotify.offline_esperanto.proto";
option optimize_for = CODE_SIZE;
option objc_class_prefix = "ESP";

message KeyStatsResponse {
  int64 cached = 1;
  int64 offline = 2;
  int64 memory = 3;
}

message SetLinkAdditionalExtensionsRequest {
  string uri = 1;
  repeated .spotify.extendedmetadata.ExtensionKind extension_kinds = 2;
}

service OfflineDebug {
  rpc OnKeyStats(.google.protobuf.Empty) returns (stream .spotify.offline_esperanto.proto.KeyStatsResponse);
  rpc SetLinkAdditionalExtensions(.spotify.offline_esperanto.proto.SetLinkAdditionalExtensionsRequest) returns (.google.protobuf.Empty);
}
