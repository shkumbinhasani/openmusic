syntax = "proto3";

package spotify.stream_reporting_attribution.proto;

option java_package = "com.spotify.stream_reporting_attribution.proto";
option optimize_for = CODE_SIZE;
option objc_class_prefix = "ESP";

message StreamReportingAttribution {
  optional string provenance = 1;
  optional string page_id = 2;
  optional string root_specification_id = 3;
  optional string leaf_specification_id = 4;
}
