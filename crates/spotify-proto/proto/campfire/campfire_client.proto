syntax = "proto3";

package campfire.v1;

import "campfire/campfire_common.proto";
import "google/protobuf/timestamp.proto";

message RetrieveLatestNodeRequest {
  optional .campfire.v1.SortOrder sort_order = 1;
  optional int32 limit = 2;
  string page_token = 4;
}

message RetrieveLatestNodeResponse {
  repeated .campfire.v1.LatestNodeResponse latest_node_response = 1;
  string next_page_token = 2;
}

message LatestNodeResponse {
  .campfire.v1.Hierarchy hierarchy = 1;
  optional .campfire.v1.ClientNode client_node = 2;
}

message RetrieveNodeRequest {
  string hierarchy_id = 1;
  string node_path_id = 2;
  int32 prev_limit = 3;
  int32 next_limit = 4;
  optional .campfire.v1.SortOrder sort_order = 5;
  string page_token = 8;
  int32 page_size = 9;
}

message RetrieveNodeResponse {
  .campfire.v1.Hierarchy hierarchy = 1;
  repeated .campfire.v1.ClientNode client_node = 2;
  string next_page_token = 3;
  string previous_page_token = 4;
}

message Hierarchy {
  .campfire.v1.HierarchyIdentifier hierarchy_identifier = 1;
  .campfire.v1.HierarchyStatistic hierarchy_statistic = 3;
  .campfire.v1.HierarchyMetadata hierarchy_metadata = 4;
  optional .campfire.v1.Group group = 5;
}

message HierarchyMetadata {
  string initiator_username = 1;
  .campfire.v1.HierarchyStatus hierarchy_status = 2;
  .campfire.v1.HierarchyUserParticipationStatus current_user_participation_status = 3;
  .campfire.v1.HierarchySource source = 4;
  .campfire.v1.HierarchyType hierarchy_type = 5;
  .google.protobuf.Timestamp created_at = 6;
  bool current_user_channel_muted = 7;
}

message HierarchyStatistic {
  int32 total_user_unseen_events = 1;
  bool all_events_seen = 2;
  int32 total_user_unseen_activity_events = 3;
  int32 total_user_unseen_contribution_events = 4;
  string revision = 5;
}

message Group {
  optional string name = 1;
  repeated .campfire.v1.GroupMember group_member = 2;
}

message GroupMember {
  string member_username = 1;
  .campfire.v1.GroupMemberStatus group_member_status = 2;
  .campfire.v1.HierarchyUserRole user_role = 3;
  string invited_by_username = 4;
}

message GroupDetail {
  repeated string member_username = 2;
  string name = 3;
}

message ClientNode {
  .campfire.v1.NodeIdentifier node_identifier = 1;
  .campfire.v1.HierarchyIdentifier hierarchy_identifier = 2;
  repeated .campfire.v1.ClientNode child_node = 3;
  .campfire.v1.NodeStatistic node_statistic = 4;
  .campfire.v1.ModerationStatus moderation_status = 5;
  .campfire.v1.ClientEventCapture event_capture = 6;
  optional .campfire.v1.GroupDetail group_detail = 7;
  optional .campfire.v1.MessagePayload message_payload = 8;
}

message NodeIdentifier {
  string node_path_id = 1;
  .campfire.v1.NodeClass node_class = 2;
  string uri = 3;
}

message NodeStatistic {
  bool user_seen = 1;
}

message ClientEventCapture {
  string init_username = 1;
  .campfire.v1.EventCapture event_capture = 2;
  optional .campfire.v1.AgentContext agent_context = 3;
}

message MessagePayload {
  oneof cmp {
    .campfire.v1.ContributionPayload contribution_payload = 1;
    .campfire.v1.ActivityPayload activity_payload = 2;
  }
}

message ContributionMetadata {
  optional string message_envelope = 1;
}

message ContributionPayload {
  oneof ccp {
    .campfire.v1.FreeText free_text = 1;
    .campfire.v1.TrackedShare tracked_share = 2;
    .campfire.v1.OffplatformTrackedShare op_tracked_share = 3;
  }
  optional .campfire.v1.ContributionMetadata metadata = 7;
}

message ActivityPayload {
}

message ClientNodeRequest {
  repeated .campfire.v1.NodeRequest node_request = 1;
}

message ClientNodeResponse {
  .campfire.v1.Hierarchy hierarchy = 1;
  repeated .campfire.v1.ClientNode client_node = 2;
}

message NodeRequest {
  oneof cnr {
    .campfire.v1.HierarchyRequest hierarchy_request = 1;
    .campfire.v1.MessageRequest message_request = 2;
  }
  optional .campfire.v1.AgentContext agent_context = 7;
}

message HierarchyRequest {
}

message MessageRequest {
  oneof cmr {
    .campfire.v1.AddContribution add_contribution = 1;
    .campfire.v1.AddContributionForGroup add_contribution_for_group = 6;
  }
}

message AddContribution {
  string parent_node_path_id = 1;
  .campfire.v1.ContributionPayload payload = 2;
}

message AddContributionForGroup {
  .campfire.v1.GroupDetail group_detail = 1;
  .campfire.v1.ContributionPayload payload = 2;
}

enum HierarchyUserParticipationStatus {
  HIERARCHY_USER_PARTICIPATION_STATUS_UNSPECIFIED = 0;
  HIERARCHY_USER_PARTICIPATION_STATUS_ACCEPTED = 1;
  HIERARCHY_USER_PARTICIPATION_STATUS_REJECTED = 2;
}

enum HierarchySource {
  HIERARCHY_SOURCE_UNSPECIFIED = 0;
}

enum GroupMemberStatus {
  UNSPECIFIED = 0;
  OPTED_OUT = 1;
  PENDING = 2;
}

enum HierarchyUserRole {
  HIERARCHY_USER_ROLE_UNSPECIFIED = 0;
  HIERARCHY_USER_ROLE_MEMBER = 1;
  HIERARCHY_USER_ROLE_ADMIN = 2;
}

enum ModerationStatus {
  MODERATION_STATUS_UNSPECIFIED = 0;
}
