syntax = "proto3";

package spotify.speedpreview.proto;

option java_package = "com.spotify.speedpreview.proto";
option optimize_for = CODE_SIZE;

message SpeedPreview {
  string track_uri = 1;
  double speed_multiplier = 2;
  optional double pitch_factor = 3;
  optional int64 start_position_ms = 4;
  optional int64 end_position_ms = 5;
  string context_uri = 6;
}
