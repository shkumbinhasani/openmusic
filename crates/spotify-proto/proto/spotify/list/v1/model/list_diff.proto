syntax = "proto3";

package spotify.list.v1.model;

import "spotify/list/v1/model/ops.proto";

option java_package = "com.spotify.list.v1.model";
option java_outer_classname = "DiffProto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message ListDiff {
  repeated .spotify.list.v1.model.Op ops = 1;
}
