syntax = "proto3";

package spotify.karaoke_esperanto.proto;

option java_package = "com.spotify.karaoke.esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message KaraokeGetVocalVolumeRequest {
}

message KaraokeGetVocalVolumeResponse {
  float volume = 1;
}
