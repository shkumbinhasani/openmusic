syntax = "proto3";

package spotify.connectgroup.v1;

import "connect_group.proto";

option optimize_for = CODE_SIZE;

message GroupDataEvent {
  repeated .spotify.connectgroup.v1.GroupData group_data = 1;
}

message GroupDeviceVolumeEvent {
  repeated .spotify.connectgroup.v1.GroupDeviceVolume volumes = 1;
}

message GetAllGroupDataResponse {
  repeated .spotify.connectgroup.v1.GroupData group_data = 1;
  repeated .spotify.connectgroup.v1.GroupDeviceVolume group_device_volumes = 2;
}

message KnownGroupInstance {
  string spotify_device_id = 1;
  string group_instance = 2;
  optional int64 timestamp_ms = 3;
}

message RefreshGroupDataRequest {
  repeated .spotify.connectgroup.v1.KnownGroupInstance known_instances = 1;
}
