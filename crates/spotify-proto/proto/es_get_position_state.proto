syntax = "proto3";

package spotify.player.esperanto.proto;

option java_package = "com.spotify.player.esperanto.proto";
option optimize_for = CODE_SIZE;
option objc_class_prefix = "ESP";

message GetPositionStateRequest {
  optional string logical_playback_identifier = 1;
}

message GetPositionStateResponse {
  enum Error {
    OK = 0;
    NOT_FOUND = 1;
  }
  .spotify.player.esperanto.proto.GetPositionStateResponse.Error error = 1;
  uint64 timestamp = 2;
  uint64 position = 3;
  double playback_speed = 4;
}
