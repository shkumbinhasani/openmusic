syntax = "proto3";

package spotify.collection_platform.proto;

import "collection_itemdata.proto";

option java_package = "com.spotify.collection_platform.esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message CollectionPlatformItem {
  string uri = 1;
  int64 add_time = 2;
  optional .spotify.collection.itemdata.ItemData item_data = 3;
}

message CollectionPlatformContextItem {
  string uri = 1;
  int64 add_time = 2;
  string context_uri = 3;
  optional .spotify.collection.itemdata.ItemData item_data = 4;
}
