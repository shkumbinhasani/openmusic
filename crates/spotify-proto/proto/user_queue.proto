syntax = "proto3";

package spotify.queue.proto;

import "item_reporting_context.proto";

option optimize_for = CODE_SIZE;

message SyntheticItemInfo {
  .spotify.queue.proto.Source source = 1;
}

message Item {
  string uid = 1;
  string uri = 2;
  .spotify.timeline_reporter.proto.ItemReportingContext item_reporting_context = 3;
  .spotify.queue.proto.SyntheticItemInfo synthetic_info = 4;
  string queued_by = 5;
  string original_list_item_uid = 6;
  bool hidden_in_queue = 7;
  bool is_jam_queue = 8;
}

message UserQueue {
  repeated .spotify.queue.proto.Item items = 1;
  string anchor_uid = 2;
  .spotify.queue.proto.QueueSnapshot snapshot = 3;
}

message QueueSnapshot {
  string list_uri = 1;
  repeated .spotify.queue.proto.Operation operations = 2;
}

message Operation {
  oneof operation {
    .spotify.queue.proto.AddOperation add = 1;
    .spotify.queue.proto.RemoveOperation remove = 2;
    .spotify.queue.proto.MoveOperation move = 3;
  }
}

message AddOperation {
  .spotify.queue.proto.Item item = 1;
  string anchor_uid = 2;
}

message RemoveOperation {
  string uid = 1;
}

message MoveOperation {
  string uid = 1;
  string anchor_uid = 2;
}

enum Source {
  SOURCE_UNKNOWN = 0;
  SOURCE_LIST = 1;
  SOURCE_QUEUE = 2;
  SOURCE_AUTOPLAY = 3;
  SOURCE_MFT = 4;
  SOURCE_AUTOMIX_PREVIEW = 5;
}
