[workspace]
members = ["crates/spotify-client", "crates/spotify-proto"]

[package]
name = "openmusic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
gpui-component = "0.5.1"
spotify-client = { path = "crates/spotify-client" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSWorkspace", "NSAccessibility", "NSResponder", "NSView", "NSGlassEffectView", "NSVisualEffectView", "NSColor", "NSGraphics", "NSButton", "NSButtonCell", "NSControl", "NSCell", "NSActionCell", "NSImage", "NSImageView", "NSImageCell", "NSTextField", "NSTextFieldCell", "NSSlider", "NSSliderCell", "NSFont", "NSEvent", "NSText", "NSParagraphStyle", "NSFontDescriptor", "NSApplication", "NSWindow", "NSToolbar", "NSBitmapImageRep", "NSImageRep", "objc2-core-graphics", "NSColorSpace", "NSMenu", "NSMenuItem", "NSSearchField", "NSSearchFieldCell", "NSPanel", "NSTrackingArea", "NSRunningApplication", "NSAlert", "NSPasteboard", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSData", "NSObject", "NSDictionary", "NSArray", "NSError", "NSEnumerator", "objc2-core-foundation", "NSValue", "NSURL", "NSBundle", "NSNotification", "NSOperation", "NSLocale", "NSDistributedNotificationCenter", "NSUserDefaults"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCShareableContent", "SCScreenshotManager", "SCStream", "block2", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGImage"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNError", "UNNotification", "UNNotificationAttachment", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "objc2-core-media", "AVAnimation", "AVAsset", "AVPlayer", "AVPlayerItem", "AVPlayerLayer", "AVPlayerLooper"] }
block2 = "0.6"
raw-window-handle = "0.6"
