syntax = "proto3";

package spotify.lyrics_reporting_esperanto.proto;

import "lyrics_reporting/status_code.proto";

option java_package = "com.spotify.lyrics_reporting_esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message LyricsStartResponse {
  .spotify.lyrics_reporting_esperanto.proto.StatusCode status_code = 1;
  bytes lyrics_viewing_id = 2;
}
