syntax = "proto3";

package spotify.playlist_esperanto.proto;

import "creation_info.proto";
import "google/protobuf/empty.proto";
import "playlist_query.proto";
import "response_status.proto";

option java_package = "spotify.playlist.esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message CopyRequest {
  message ItemIdSet {
    repeated string item_ids = 1;
  }
  string uri = 1;
  .spotify.playlist_esperanto.proto.PlaylistQuery query = 2;
  oneof items {
    .google.protobuf.Empty all = 3;
    .spotify.playlist_esperanto.proto.CopyRequest.ItemIdSet item_ids = 4;
  }
  .spotify.playlist.cosmos.proto.CreationInfo creation_info = 5;
  string name = 6;
  string description = 7;
}

message CopyResponse {
  .spotify.playlist_esperanto.proto.ResponseStatus status = 1;
  string uri = 2;
  repeated string item_uris = 3;
}
