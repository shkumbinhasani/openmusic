syntax = "proto3";

package spotify.your_library.proto;

option java_package = "spotify.your_library.esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message GetArtistPlaylistsRequest {
  string artist_uri = 1;
}

message ArtistPlaylist {
  string playlist_uri = 1;
  uint32 track_count = 2;
}

message GetArtistPlaylistsResponse {
  repeated .spotify.your_library.proto.ArtistPlaylist playlist = 1;
  uint32 status_code = 98;
  string error = 99;
}
