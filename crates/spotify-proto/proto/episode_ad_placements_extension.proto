syntax = "proto3";

package spotify.fingerprintfilterservice;

option java_package = "com.spotify.fingerprintfilterservice";
option java_outer_classname = "EpisodeAdPlacementsProto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message EpisodeAdPlacements {
  int32 audio_duration_ms = 1;
  repeated .spotify.fingerprintfilterservice.AdPlacement placements = 2;
  optional string fingerprints_cdn_url = 3;
  string audio_uri = 4;
  optional .spotify.fingerprintfilterservice.TimelineMapping seek_lower_bound = 5;
}

message AdPlacement {
  int32 start_ms = 1;
  int32 duration_ms = 2;
  int32 roll_position = 3;
}

message TimelineMappingEvent {
  int32 timestamp_ms = 1;
  int32 delta_ms = 2;
}

message TimelineMapping {
  repeated .spotify.fingerprintfilterservice.TimelineMappingEvent events = 1;
}
