syntax = "proto2";

package spotify.playlist.cosmos.proto;

option java_package = "com.spotify.playlist.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message CreationInfo {
  enum OriginType {
    ORIGIN_TYPE_UNSPECIFIED = 0;
    ORIGIN_TYPE_FRESH = 1;
    ORIGIN_TYPE_CLONED = 2;
    ORIGIN_TYPE_AGENTIC = 3;
  }
  optional .spotify.playlist.cosmos.proto.CreationInfo.OriginType origin_type = 1;
  optional string origin_uri = 2;
}
