syntax = "proto3";

package spotify.your_library.proto;

option java_package = "spotify.your_library.esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message TransferProgressRequest {
}

message TransferProgress {
  string transfer_id = 1;
  .spotify.your_library.proto.TransferStatus status = 2;
  float progress = 3;
  int32 items_moved = 4;
  int32 items_total = 5;
}

message TransferProgressResponse {
  .spotify.your_library.proto.TransferProgress transfer_progress = 1;
  uint32 status_code = 98;
  string error = 99;
}

enum TransferStatus {
  IN_PROGRESS = 0;
  COMPLETED = 1;
  FAILED = 2;
}
