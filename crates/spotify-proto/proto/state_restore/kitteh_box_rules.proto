syntax = "proto2";

package spotify.player.proto.state_restore;

option optimize_for = CODE_SIZE;

message KittehBoxRules {
  enum Transition {
    ADVANCE = 0;
    SKIP_NEXT = 1;
    SKIP_PREV = 2;
  }
  enum Position {
    BETWEEN_TRACKS = 0;
    ON_DELIMITER = 1;
    ON_NODE_TRACK = 2;
  }
  map<string, bytes> node_aspects = 1;
  required .spotify.player.proto.state_restore.KittehBoxRules.Position pos = 2;
  required .spotify.player.proto.state_restore.KittehBoxRules.Transition last_transition = 3;
  required int32 context_iteration = 4;
  required bool pending_skip_to = 5;
  optional int64 page_index = 6;
}
