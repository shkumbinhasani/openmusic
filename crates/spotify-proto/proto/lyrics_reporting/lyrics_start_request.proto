syntax = "proto3";

package spotify.lyrics_reporting_esperanto.proto;

import "lyrics_reporting/reason_start.proto";

option java_package = "com.spotify.lyrics_reporting_esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message LyricsStartRequest {
  string content_uri = 1;
  .spotify.lyrics_reporting_esperanto.proto.ReasonStart reason_start = 4;
  optional string surface_type = 6;
  optional bool is_snippet = 7;
  optional string sync_type = 8;
  optional string provider_lyrics_id = 9;
  string playback_id = 10;
  optional string provider = 11;
  optional bool is_visible = 12;
  optional bool is_background = 13;
}
