syntax = "proto3";

package spotify.ads.formats;

option java_package = "com.spotify.ads.formats.proto";
option java_outer_classname = "AdLocationsProto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "SPT";

message AdLocation {
  enum Slot {
    UNKNOWN = 0;
    PODCAST_PREROLL = 1;
    PODCAST_POSTROLL = 2;
    PODCAST_MIDROLL_1 = 3;
    PODCAST_MIDROLL_2 = 4;
    PODCAST_MIDROLL_3 = 5;
    PODCAST_MIDROLL_4 = 6;
    PODCAST_MIDROLL_5 = 7;
    STREAM = 8;
    PODCAST_CREATOR_SPONSORSHIP_1 = 9;
    PODCAST_CREATOR_SPONSORSHIP_2 = 10;
  }
  .spotify.ads.formats.AdLocation.Slot slot = 1;
  uint32 start_ms = 2;
  uint32 stop_ms = 3;
}

message AdLocations {
  enum AdSegmentContentType {
    UNKNOWN = 0;
    PODCAST_CENTRIC = 1;
    MUSIC_CENTRIC = 2;
  }
  .spotify.ads.formats.AdLocations.AdSegmentContentType content_type = 1;
  repeated .spotify.ads.formats.AdLocation segments = 2;
  string request_id = 3;
}
