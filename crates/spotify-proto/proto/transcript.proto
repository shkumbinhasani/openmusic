syntax = "proto3";

package spotify.contentagnostic.v2;

import "google/protobuf/duration.proto";
import "flat_file.proto";

option java_package = "com.spotify.contentagnostic.v2";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message Transcript {
  .spotify.contentagnostic.v2.FlatFile flat_file = 1;
  optional .spotify.contentagnostic.v2.TranscriptOffsets offsets = 2;
}

message TranscriptOffsets {
  .google.protobuf.Duration start = 1;
  .google.protobuf.Duration end = 2;
}
