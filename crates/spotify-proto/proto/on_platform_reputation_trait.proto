syntax = "proto3";

package spotify.contentagnostic.v2;

option java_package = "com.spotify.contentagnostic.v2";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;

message OnPlatformReputationTrait {
  optional int64 total_established_user_relationships = 1;
  optional bool is_verified = 2;
  optional int64 total_plays = 3;
  optional int64 monthly_listeners = 4;
  optional .spotify.contentagnostic.v2.ChartPosition chart_position = 7;
  optional .spotify.contentagnostic.v2.Rating rating = 8;
  reserved 5, 6;
}

message Chart {
  string name = 1;
  optional string uri = 2;
}

message ChartPosition {
  .spotify.contentagnostic.v2.Chart chart = 1;
  int32 position = 2;
}

message Rating {
  double average = 1;
  int64 count = 2;
  optional .spotify.contentagnostic.v2.GranularRatings granular_ratings = 3;
}

message GranularRatings {
  int64 one_star = 1;
  int64 two_stars = 2;
  int64 three_stars = 3;
  int64 four_stars = 4;
  int64 five_stars = 5;
}
