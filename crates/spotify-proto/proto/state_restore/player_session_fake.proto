syntax = "proto2";

package spotify.player.proto.state_restore;

import "context.proto";
import "state_restore/context_player_state.proto";

option optimize_for = CODE_SIZE;

message PlayerSessionFake {
  required .spotify.player.proto.state_restore.ContextPlayerState player_state = 1;
  required .spotify.player.proto.Context player_context = 2;
  required bool is_finished = 3;
}
