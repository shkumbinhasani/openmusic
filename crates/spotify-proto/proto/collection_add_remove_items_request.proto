syntax = "proto3";

package spotify.collection_cosmos.proto;

import "status.proto";
import "collection_itemdata.proto";

option java_package = "spotify.collection.esperanto.proto";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option objc_class_prefix = "ESP";

message CollectionAddRemoveItem {
  string uri = 1;
  optional .spotify.collection.itemdata.ItemData item_data = 2;
}

message CollectionAddRemoveItemsRequest {
  repeated string uri = 1;
  repeated .spotify.collection_cosmos.proto.CollectionAddRemoveItem items = 2;
}

message CollectionAddRemoveItemsResponse {
  .spotify.collection_cosmos.proto.Status status = 1;
}
