syntax = "proto3";

package spotify.searchview;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.spotify.searchview.proto";
option java_outer_classname = "SearchviewShared";
option optimize_for = CODE_SIZE;
option java_multiple_files = true;
option swift_prefix = "Proto";

message ChatEntryPoint {
  string placeholder = 1;
  repeated .spotify.searchview.ConversationStarterItem chat_starter_items = 2;
  string conversation_id = 3;
}

message ConversationStarterItem {
  string prompt = 1;
  string conversation_id = 2;
  string uri = 3;
}

message PodcastChapter {
  enum ChapterType {
    CHAPTER_TYPE_UNKNOWN = 0;
    CHAPTER_TYPE_TALK = 1;
    CHAPTER_TYPE_MUSIC = 2;
  }
  string subtitle = 1;
  string show_name = 2;
  .google.protobuf.Duration duration = 3;
  bool explicit = 4;
  bool mogef19 = 5;
  bool age_assured = 6;
  .google.protobuf.Timestamp publication_time = 7;
  bool video = 8;
  string video_image_uri = 9;
  .spotify.searchview.PodcastChapter.ChapterType type = 10;
}

message FilterCatalog {
  repeated .spotify.searchview.FilterOption filters = 1;
}

message FilterOption {
  string filter_id = 1;
  string display_name = 2;
  bool is_active = 3;
}

message GatingDecision {
  message Permit {
  }
  message Deny {
    repeated .spotify.searchview.GatingDecision.DenyReason reasons = 1;
  }
  message GatingContext {
    string feature_id = 1;
    string action = 2;
  }
  enum DenyReason {
    DENY_REASON_UNSPECIFIED = 0;
    DENY_REASON_ENTITLEMENT_MISSING = 1;
  }
  enum GatingIndicator {
    GATING_INDICATOR_UNSPECIFIED = 0;
    GATING_INDICATOR_PREMIUM = 1;
  }
  oneof result {
    .spotify.searchview.GatingDecision.Permit permit = 1;
    .spotify.searchview.GatingDecision.Deny deny = 2;
  }
  .spotify.searchview.GatingDecision.GatingIndicator indicator = 3;
  .spotify.searchview.GatingDecision.GatingContext gating_context = 4;
}
